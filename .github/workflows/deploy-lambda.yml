name: Deploy Lambda to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'lambda_function.py'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub UI

env:
  AWS_REGION: us-east-1
  STACK_NAME: experian-risk-stack

jobs:
  deploy:
    name: Deploy Lambda Function
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Lambda and S3 names from CloudFormation
        id: get_resources
        run: |
          LAMBDA_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?ExportName==`RiskApiLambdaName`].OutputValue' \
            --output text)
          S3_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?ExportName==`RiskDataBucketName`].OutputValue' \
            --output text)
          echo "lambda_name=$LAMBDA_NAME" >> $GITHUB_OUTPUT
          echo "s3_bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
          echo "Lambda Function: $LAMBDA_NAME"
          echo "S3 Bucket: $S3_BUCKET"

      - name: Package Lambda function
        run: |
          zip -r lambda_deployment.zip lambda_function.py
          echo "✓ Lambda packaged successfully"

      - name: Upload to S3
        run: |
          aws s3 cp lambda_deployment.zip \
            s3://${{ steps.get_resources.outputs.s3_bucket }}/lambda/lambda_deployment.zip
          echo "✓ Uploaded to S3"

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name ${{ steps.get_resources.outputs.lambda_name }} \
            --s3-bucket ${{ steps.get_resources.outputs.s3_bucket }} \
            --s3-key lambda/lambda_deployment.zip
          echo "✓ Lambda function updated"

      - name: Wait for Lambda update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ steps.get_resources.outputs.lambda_name }}
          echo "✓ Lambda is ready"

      - name: Get Lambda info
        run: |
          aws lambda get-function \
            --function-name ${{ steps.get_resources.outputs.lambda_name }} \
            --query 'Configuration.{LastModified:LastModified,Runtime:Runtime,CodeSize:CodeSize}' \
            --output table

      - name: Deployment summary
        run: |
          echo "============================================"
          echo "✅ Deployment completed successfully!"
          echo "============================================"
          echo "Function: ${{ steps.get_resources.outputs.lambda_name }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Time: $(date -u)"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "============================================"
